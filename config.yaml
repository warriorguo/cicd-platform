# CI/CD Platform Configuration File
# This file contains default configuration values for the platform

server:
  host: "0.0.0.0"
  port: "8080"

database:
  host: "localhost"
  port: "5432"
  user: "postgres"
  password: "password"
  dbname: "cicd"
  sslmode: "disable"

k8s:
  in_cluster: false
  kubeconfig: ""  # Auto-detected if empty
  pipeline_namespace: "cicd-runners"
  tekton_namespace: "tekton-pipelines"

registry:
  default_registry: "harbor.company.com"
  secret_name: "cicd-registry-secret"