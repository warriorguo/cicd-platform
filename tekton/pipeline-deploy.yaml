apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cicd-deploy
  namespace: cicd-runners
spec:
  params:
    - name: image-repo
      type: string
      description: Container image repository
    - name: image-tag
      type: string
      description: Container image tag
    - name: deploy-namespace
      type: string
      description: Kubernetes namespace for deployment
    - name: deploy-name
      type: string
      description: Deployment name
    - name: replicas
      type: string
      description: Number of replicas to deploy
      default: "1"
    - name: env-vars
      type: string
      description: Environment variables as JSON array
      default: "[]"
    - name: service-port
      type: string
      description: Container and service port
      default: "8080"
    - name: service-account
      type: string
      description: Optional ServiceAccount for the deployment (leave empty for default)
      default: ""

  tasks:
    - name: update-deployment
      taskSpec:
        params:
          - name: DEPLOYMENT_NAME
            type: string
          - name: NAMESPACE
            type: string
          - name: IMAGE
            type: string
          - name: REPLICAS
            type: string
          - name: ENV_VARS
            type: string
          - name: SERVICE_PORT
            type: string
          - name: SERVICE_ACCOUNT
            type: string
        steps:
          - name: update
            image: bitnami/kubectl:latest
            script: |
              #!/bin/bash
              set -e

              echo "Creating or updating deployment $(params.DEPLOYMENT_NAME) in namespace $(params.NAMESPACE)"

              # Build serviceAccountName line if provided
              SA_SPEC=""
              if [ -n "$(params.SERVICE_ACCOUNT)" ]; then
                SA_SPEC="serviceAccountName: $(params.SERVICE_ACCOUNT)"
              fi

              # Check if deployment exists
              if kubectl get deployment $(params.DEPLOYMENT_NAME) -n $(params.NAMESPACE) >/dev/null 2>&1; then
                echo "Deployment exists, updating..."

                # Update image
                kubectl set image deployment/$(params.DEPLOYMENT_NAME) \
                  *=$(params.IMAGE) \
                  -n $(params.NAMESPACE)

                # Scale deployment to desired replicas
                echo "Scaling deployment to $(params.REPLICAS) replicas..."
                kubectl scale deployment/$(params.DEPLOYMENT_NAME) \
                  --replicas=$(params.REPLICAS) \
                  -n $(params.NAMESPACE)

                # Update service account if specified
                if [ -n "$(params.SERVICE_ACCOUNT)" ]; then
                  echo "Updating service account to $(params.SERVICE_ACCOUNT)..."
                  kubectl patch deployment $(params.DEPLOYMENT_NAME) -n $(params.NAMESPACE) \
                    -p '{"spec":{"template":{"spec":{"serviceAccountName":"$(params.SERVICE_ACCOUNT)"}}}}'
                fi
              else
                echo "Deployment does not exist, creating..."

                # Create deployment using kubectl apply with YAML
                cat <<EOFYAML | kubectl apply -f -
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: $(params.DEPLOYMENT_NAME)
                namespace: $(params.NAMESPACE)
                labels:
                  app: $(params.DEPLOYMENT_NAME)
                  managed-by: cicd-platform
              spec:
                replicas: $(params.REPLICAS)
                selector:
                  matchLabels:
                    app: $(params.DEPLOYMENT_NAME)
                template:
                  metadata:
                    labels:
                      app: $(params.DEPLOYMENT_NAME)
                  spec:
                    $SA_SPEC
                    containers:
                    - name: $(params.DEPLOYMENT_NAME)
                      image: $(params.IMAGE)
                      ports:
                      - containerPort: $(params.SERVICE_PORT)
                      resources:
                        requests:
                          memory: "64Mi"
                          cpu: "50m"
                        limits:
                          memory: "256Mi"
                          cpu: "200m"
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: $(params.DEPLOYMENT_NAME)
                namespace: $(params.NAMESPACE)
                labels:
                  app: $(params.DEPLOYMENT_NAME)
              spec:
                selector:
                  app: $(params.DEPLOYMENT_NAME)
                ports:
                - port: $(params.SERVICE_PORT)
                  targetPort: $(params.SERVICE_PORT)
                  protocol: TCP
                type: ClusterIP
              EOFYAML

                echo "Created deployment and service for $(params.DEPLOYMENT_NAME)"
              fi

              # Update environment variables if provided
              ENV_VARS='$(params.ENV_VARS)'
              if [ "$ENV_VARS" != "[]" ] && [ -n "$ENV_VARS" ]; then
                echo "Applying environment variables..."
                echo "$ENV_VARS" | jq -r '.[] | "--env=\(.name)=\(.value)"' | tr '\n' ' ' | xargs -r kubectl set env deployment/$(params.DEPLOYMENT_NAME) -n $(params.NAMESPACE) --containers='*'
              fi

              # Force restart pods (needed when image tag is unchanged, e.g. reload)
              echo "Restarting deployment pods..."
              kubectl rollout restart deployment/$(params.DEPLOYMENT_NAME) \
                -n $(params.NAMESPACE)

              echo "Waiting for rollout to complete..."
              kubectl rollout status deployment/$(params.DEPLOYMENT_NAME) \
                -n $(params.NAMESPACE) \
                --timeout=5m

              echo "Deployment $(params.DEPLOYMENT_NAME) ready successfully"
      params:
        - name: DEPLOYMENT_NAME
          value: $(params.deploy-name)
        - name: NAMESPACE
          value: $(params.deploy-namespace)
        - name: IMAGE
          value: "$(params.image-repo):$(params.image-tag)"
        - name: REPLICAS
          value: $(params.replicas)
        - name: ENV_VARS
          value: $(params.env-vars)
        - name: SERVICE_PORT
          value: $(params.service-port)
        - name: SERVICE_ACCOUNT
          value: $(params.service-account)