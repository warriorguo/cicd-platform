apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cicd-default-serviceaccount
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pipeline-runner
subjects:
- kind: ServiceAccount
  name: default
  namespace: cicd-runners
---
# Also ensure pipeline-runner service account has proper permissions in default namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: pipeline-runner-default-ns
subjects:
- kind: ServiceAccount
  name: pipeline-runner
  namespace: cicd-runners
- kind: ServiceAccount
  name: default
  namespace: cicd-runners
roleRef:
  kind: ClusterRole
  name: pipeline-runner
  apiGroup: rbac.authorization.k8s.io