apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cicd-build-deploy
  namespace: cicd-runners
spec:
  params:
    - name: git-url
      type: string
      description: Git repository URL
    - name: git-revision
      type: string
      description: Git revision (branch, tag, or commit SHA)
      default: main
    - name: build-type
      type: string
      description: Build type - "dockerfile" or "docker-compose"
      default: dockerfile
    - name: dockerfile-path
      type: string
      description: Path to Dockerfile or docker-compose.yml
      default: Dockerfile
    - name: context-path
      type: string
      description: Build context path
      default: .
    - name: image-repo
      type: string
      description: Container image repository
    - name: image-tag
      type: string
      description: Container image tag
    - name: deploy-namespace
      type: string
      description: Kubernetes namespace for deployment
    - name: deploy-name
      type: string
      description: Deployment name
    - name: replicas
      type: string
      description: Number of replicas to deploy
      default: "1"
    - name: git-secret
      type: string
      description: Git credentials secret name
      default: ""
    - name: registry-secret
      type: string
      description: Registry credentials secret name
      default: ""
    - name: env-vars
      type: string
      description: Environment variables as JSON array
      default: "[]"

  workspaces:
    - name: source-ws
      description: Workspace for source code
    - name: dockerconfig-ws
      description: Docker config for registry authentication
      optional: true

  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: source-ws
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)

    - name: build-push-dockerfile
      when:
        - input: "$(params.build-type)"
          operator: in
          values: ["dockerfile"]
      runAfter:
        - fetch-source
      taskRef:
        name: kaniko
      workspaces:
        - name: source
          workspace: source-ws
        - name: dockerconfig
          workspace: dockerconfig-ws
      params:
        - name: IMAGE
          value: "$(params.image-repo):$(params.image-tag)"
        - name: DOCKERFILE
          value: $(params.dockerfile-path)
        - name: CONTEXT
          value: $(params.context-path)
        - name: EXTRA_ARGS
          value:
            - "--cache=true"
            - "--cache-ttl=24h"

    - name: build-push-docker-compose
      when:
        - input: "$(params.build-type)"
          operator: in
          values: ["docker-compose"]
      runAfter:
        - fetch-source
      taskSpec:
        params:
          - name: IMAGE
            type: string
          - name: COMPOSE_FILE
            type: string
          - name: CONTEXT
            type: string
        workspaces:
          - name: source
        steps:
          - name: build-and-push
            image: docker/compose:latest
            workingDir: $(workspaces.source.path)/$(params.CONTEXT)
            env:
              - name: DOCKER_HOST
                value: tcp://localhost:2375
            script: |
              #!/bin/sh
              set -e
              
              echo "Building with docker-compose..."
              docker-compose -f $(params.COMPOSE_FILE) build
              
              echo "Pushing image $(params.IMAGE)..."
              docker-compose -f $(params.COMPOSE_FILE) push
              
              echo "Build and push completed successfully"
          
          - name: docker-daemon
            image: docker:dind
            securityContext:
              privileged: true
            command:
              - dockerd
              - --host=tcp://127.0.0.1:2375
              - --tls=false
              - --insecure-registry=192.168.0.151:8086
      params:
        - name: IMAGE
          value: "$(params.image-repo):$(params.image-tag)"
        - name: COMPOSE_FILE
          value: $(params.dockerfile-path)
        - name: CONTEXT
          value: $(params.context-path)
      workspaces:
        - name: source
          workspace: source-ws

    - name: update-deployment
      runAfter:
        - build-push-dockerfile
        - build-push-docker-compose
      taskSpec:
        params:
          - name: DEPLOYMENT_NAME
            type: string
          - name: NAMESPACE
            type: string
          - name: IMAGE
            type: string
          - name: REPLICAS
            type: string
          - name: ENV_VARS
            type: string
        steps:
          - name: update
            image: bitnami/kubectl:latest
            script: |
              #!/bin/bash
              set -e

              echo "Creating or updating deployment $(params.DEPLOYMENT_NAME) in namespace $(params.NAMESPACE)"

              # Check if deployment exists
              if kubectl get deployment $(params.DEPLOYMENT_NAME) -n $(params.NAMESPACE) >/dev/null 2>&1; then
                echo "Deployment exists, updating..."
                
                # Update image
                kubectl set image deployment/$(params.DEPLOYMENT_NAME) \
                  *=$(params.IMAGE) \
                  -n $(params.NAMESPACE)
                
                # Scale deployment to desired replicas
                echo "Scaling deployment to $(params.REPLICAS) replicas..."
                kubectl scale deployment/$(params.DEPLOYMENT_NAME) \
                  --replicas=$(params.REPLICAS) \
                  -n $(params.NAMESPACE)
              else
                echo "Deployment does not exist, creating..."
                
                # Create deployment using kubectl apply with YAML
                cat <<EOF | kubectl apply -f -
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: $(params.DEPLOYMENT_NAME)
                namespace: $(params.NAMESPACE)
                labels:
                  app: $(params.DEPLOYMENT_NAME)
                  managed-by: cicd-platform
              spec:
                replicas: $(params.REPLICAS)
                selector:
                  matchLabels:
                    app: $(params.DEPLOYMENT_NAME)
                template:
                  metadata:
                    labels:
                      app: $(params.DEPLOYMENT_NAME)
                  spec:
                    containers:
                    - name: $(params.DEPLOYMENT_NAME)
                      image: $(params.IMAGE)
                      ports:
                      - containerPort: 80
                      resources:
                        requests:
                          memory: "64Mi"
                          cpu: "50m"
                        limits:
                          memory: "256Mi"
                          cpu: "200m"
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: $(params.DEPLOYMENT_NAME)
                namespace: $(params.NAMESPACE)
                labels:
                  app: $(params.DEPLOYMENT_NAME)
              spec:
                selector:
                  app: $(params.DEPLOYMENT_NAME)
                ports:
                - port: 80
                  targetPort: 80
                  protocol: TCP
                type: ClusterIP
              EOF
                
                echo "Created deployment and service for $(params.DEPLOYMENT_NAME)"
              fi

              # Update environment variables if provided
              ENV_VARS='$(params.ENV_VARS)'
              if [ "$ENV_VARS" != "[]" ] && [ -n "$ENV_VARS" ]; then
                echo "Applying environment variables..."
                echo "$ENV_VARS" | jq -r '.[] | "--env=\(.name)=\(.value)"' | tr '\n' ' ' | xargs -r kubectl set env deployment/$(params.DEPLOYMENT_NAME) -n $(params.NAMESPACE) --containers='*'
              fi

              echo "Waiting for rollout to complete..."
              kubectl rollout status deployment/$(params.DEPLOYMENT_NAME) \
                -n $(params.NAMESPACE) \
                --timeout=5m

              echo "Deployment $(params.DEPLOYMENT_NAME) ready successfully"
      params:
        - name: DEPLOYMENT_NAME
          value: $(params.deploy-name)
        - name: NAMESPACE
          value: $(params.deploy-namespace)
        - name: IMAGE
          value: "$(params.image-repo):$(params.image-tag)"
        - name: REPLICAS
          value: $(params.replicas)
        - name: ENV_VARS
          value: $(params.env-vars)
