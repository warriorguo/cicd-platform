apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cicd-build
  namespace: cicd-runners
spec:
  params:
    - name: git-url
      type: string
      description: Git repository URL
    - name: git-revision
      type: string
      description: Git revision (branch, tag, or commit SHA)
      default: main
    - name: build-type
      type: string
      description: Build type - "dockerfile" or "docker-compose"
      default: dockerfile
    - name: dockerfile-path
      type: string
      description: Path to Dockerfile or docker-compose.yml
      default: Dockerfile
    - name: context-path
      type: string
      description: Build context path
      default: .
    - name: image-repo
      type: string
      description: Container image repository
    - name: image-tag
      type: string
      description: Container image tag
    - name: git-secret
      type: string
      description: Git credentials secret name
      default: ""
    - name: registry-secret
      type: string
      description: Registry credentials secret name
      default: ""

  workspaces:
    - name: source-ws
      description: Workspace for source code
    - name: dockerconfig-ws
      description: Docker config for registry authentication
      optional: true

  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: source-ws
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)

    - name: build-push-dockerfile
      when:
        - input: "$(params.build-type)"
          operator: in
          values: ["dockerfile"]
      runAfter:
        - fetch-source
      taskRef:
        name: kaniko
      workspaces:
        - name: source
          workspace: source-ws
        - name: dockerconfig
          workspace: dockerconfig-ws
      params:
        - name: IMAGE
          value: "$(params.image-repo):$(params.image-tag)"
        - name: DOCKERFILE
          value: $(params.dockerfile-path)
        - name: CONTEXT
          value: $(params.context-path)
        - name: EXTRA_ARGS
          value:
            - "--cache=true"
            - "--cache-ttl=24h"

    # NOTE: docker-compose builds require an external Docker host
    # Set DOCKER_HOST_ADDRESS in your cluster to point to a Docker daemon
    # Example: tcp://docker-host.your-namespace.svc:2375
    - name: build-push-docker-compose
      when:
        - input: "$(params.build-type)"
          operator: in
          values: ["docker-compose"]
      runAfter:
        - fetch-source
      taskSpec:
        params:
          - name: IMAGE
            type: string
          - name: COMPOSE_FILE
            type: string
          - name: CONTEXT
            type: string
        workspaces:
          - name: source
        steps:
          - name: build-and-push
            image: docker:latest
            workingDir: $(workspaces.source.path)/$(params.CONTEXT)
            env:
              # Use external Docker host - deploy a docker:dind as a separate Deployment/Service
              - name: DOCKER_HOST
                value: tcp://docker-host.cicd-runners.svc.cluster.local:2375
            script: |
              #!/bin/sh
              set -e

              echo "Checking Docker connection..."
              if ! docker info > /dev/null 2>&1; then
                echo "ERROR: Cannot connect to Docker daemon at $DOCKER_HOST"
                echo "Please deploy a Docker host service in the cluster."
                echo "See: kubectl apply -f tekton/docker-host.yaml"
                exit 1
              fi

              echo "Docker connected successfully"
              docker version

              echo "Building with docker compose..."
              docker compose -f $(params.COMPOSE_FILE) build

              echo "Listing built images..."
              docker images

              # Get the target image name (registry/repo:tag)
              TARGET_IMAGE="$(params.IMAGE)"
              echo "Target image: $TARGET_IMAGE"

              # Extract services from docker-compose and tag/push each
              echo "Tagging and pushing built images to $TARGET_IMAGE..."

              # Get list of services that were built
              SERVICES=$(docker compose -f $(params.COMPOSE_FILE) config --services 2>/dev/null || echo "")

              if [ -z "$SERVICES" ]; then
                echo "No services found in compose file, trying to push directly..."
                docker compose -f $(params.COMPOSE_FILE) push || true
              else
                # For multi-service compose, tag each built image and push
                for SERVICE in $SERVICES; do
                  # Get the image name for this service from compose config
                  SERVICE_IMAGE=$(docker compose -f $(params.COMPOSE_FILE) config | grep -A 20 "^  $SERVICE:" | grep "image:" | head -1 | awk '{print $2}' || echo "")

                  if [ -z "$SERVICE_IMAGE" ]; then
                    # If no image defined, use project_service format
                    PROJECT=$(basename $(pwd))
                    SERVICE_IMAGE="${PROJECT}-${SERVICE}"
                  fi

                  echo "Processing service: $SERVICE (image: $SERVICE_IMAGE)"

                  # Check if the image exists locally
                  if docker images --format '{{.Repository}}:{{.Tag}}' | grep -q "^${SERVICE_IMAGE}"; then
                    # Tag with target registry
                    TAGGED_IMAGE="${TARGET_IMAGE}-${SERVICE}"
                    echo "Tagging $SERVICE_IMAGE as $TAGGED_IMAGE"
                    docker tag "$SERVICE_IMAGE" "$TAGGED_IMAGE" || docker tag "${SERVICE_IMAGE}:latest" "$TAGGED_IMAGE"

                    echo "Pushing $TAGGED_IMAGE..."
                    docker push "$TAGGED_IMAGE"
                  else
                    echo "Warning: Image $SERVICE_IMAGE not found locally, skipping..."
                  fi
                done

                # Also try to create and push a combined/main image if there's a main service
                # Tag the first service as the main image
                FIRST_SERVICE=$(echo "$SERVICES" | head -1)
                if [ -n "$FIRST_SERVICE" ]; then
                  PROJECT=$(basename $(pwd))
                  FIRST_IMAGE="${PROJECT}-${FIRST_SERVICE}"
                  if docker images --format '{{.Repository}}:{{.Tag}}' | grep -q "^${FIRST_IMAGE}"; then
                    echo "Tagging $FIRST_IMAGE as main image $TARGET_IMAGE"
                    docker tag "$FIRST_IMAGE" "$TARGET_IMAGE" || docker tag "${FIRST_IMAGE}:latest" "$TARGET_IMAGE"
                    docker push "$TARGET_IMAGE"
                  fi
                fi
              fi

              echo "Build and push completed successfully"
      params:
        - name: IMAGE
          value: "$(params.image-repo):$(params.image-tag)"
        - name: COMPOSE_FILE
          value: $(params.dockerfile-path)
        - name: CONTEXT
          value: $(params.context-path)
      workspaces:
        - name: source
          workspace: source-ws