apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-backend
  namespace: cicd-system
  labels:
    app: cicd-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-backend
  template:
    metadata:
      labels:
        app: cicd-backend
    spec:
      serviceAccountName: cicd-backend
      containers:
      - name: backend
        image: cicd-platform/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_HOST
          value: "postgresql"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: cicd-postgres-secret
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cicd-postgres-secret
              key: password
        - name: DATABASE_DBNAME
          value: "cicd"
        - name: K8S_IN_CLUSTER
          value: "true"
        - name: K8S_PIPELINE_NAMESPACE
          value: "cicd-runners"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: cicd-backend
  namespace: cicd-system
  labels:
    app: cicd-backend
spec:
  selector:
    app: cicd-backend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP